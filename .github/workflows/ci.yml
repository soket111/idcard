name: ID Card CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build using Maven
        run: mvn clean package -DskipTests

      - name: Run tests using SQLite
        run: mvn test -Dspring.profiles.active=test

      - name: Run Ansible Playbook to deploy
        run: |
          echo "Running Ansible Playbook"
          echo "ansible-playbook -i inventory.ini deploy.yml"
          echo "Deploy to Web Server completed"

      - name: Send email on failure
        if: failure()
        run: |
          echo "Build failed"
          echo "Send email to: srengty@gmail.com"
          echo "Send email to developer: ${{ github.event.head_commit.author.email }}"